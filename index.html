/* ---- egg animation ---- */
.eggs{cursor:pointer}
.eggs g,.eggs .shd{transform-box:fill-box;transform-origin:50% 90%}
.e1{animation:drop .7s cubic-bezier(.3,1.5,.5,1) .05s both,bobhop 6.5s ease-in-out .8s infinite}
.e2{animation:drop .7s cubic-bezier(.3,1.5,.5,1) .2s both,bobhop 6.5s ease-in-out 1.1s infinite}
.e3{animation:drop .8s cubic-bezier(.3,1.5,.5,1) .35s both,rock 4.2s ease-in-out 1.15s infinite}
.eggs g.sp{transform-origin:50% 50%;animation:spark 2.8s ease-in-out infinite;opacity:0}
.eggs g.bs{transform-origin:50% 50%;animation:burst .85s cubic-bezier(.2,.8,.3,1) forwards;pointer-events:none}
.tw{animation:tw 2.6s ease-in-out infinite}
.shd{animation:shd 4.2s ease-in-out 1.15s infinite}
.eggs g.wg{transform-origin:50% 90%}
.wob .wg{animation:wiggle .7s ease-in-out}
.hz{display:none}.hatching .hz{display:inline}.hatching .e3{visibility:hidden}
.eggs g.pip{transform-origin:50% 100%;opacity:0}
.hatching .hzg{animation:hshake 4s linear both}
.hatching .ck{animation:chick 4s ease-in-out both}
.hatching .cap{animation:capfly 4s ease-in both}
.hatching .pip{animation:pipin 4s ease-out both}
@keyframes drop{0%{transform:translateY(-38px);opacity:0}60%{opacity:1}100%{transform:translateY(0);opacity:1}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes bobhop{0%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}55%{transform:translateY(0)}78%{transform:translateY(0) scale(1.05,.93)}86%{transform:translateY(-18px) rotate(-5deg) scale(.97,1.04)}93%{transform:translateY(0) scale(1.06,.92)}97%{transform:translateY(-2px) scale(.99,1.01)}}
@keyframes spark{0%,100%{opacity:0;transform:scale(.2) rotate(0)}50%{opacity:.95;transform:scale(1) rotate(45deg)}}
@keyframes burst{0%{opacity:1;transform:translate(0,0) scale(.3)}70%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1)}}
@keyframes rock{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-9px) rotate(3deg)}}
@keyframes hshake{0%{transform:rotate(0)}3%{transform:rotate(-7deg)}6%{transform:rotate(7deg)}9%{transform:rotate(-9deg)}12%{transform:rotate(9deg)}15%{transform:rotate(-6deg)}18%{transform:rotate(5deg)}21%,100%{transform:rotate(0)}}
@keyframes chick{0%,20%{transform:translateY(26px)}28%{transform:translateY(-14px) scale(1.06,.94)}34%{transform:translateY(-7px)}40%{transform:translateY(-9px) rotate(-9deg)}50%{transform:translateY(-9px) rotate(9deg)}60%{transform:translateY(-9px) rotate(-6deg)}72%{transform:translateY(-9px) rotate(0)}84%,100%{transform:translateY(26px)}}
@keyframes capfly{0%,19%{transform:none;opacity:1}30%{transform:translate(18px,-30px) rotate(25deg);opacity:1}48%{transform:translate(34px,14px) rotate(70deg);opacity:0}84%{transform:translate(0,-34px) rotate(0);opacity:0}96%,100%{transform:none;opacity:1}}
@keyframes pipin{0%,26%{opacity:0;transform:scale(.2)}32%{opacity:1;transform:scale(1.15)}38%{transform:scale(1)}64%{opacity:1;transform:scale(1)}72%,100%{opacity:0;transform:scale(.6)}}
@keyframes tw{0%,100%{opacity:.65}50%{opacity:.15}}
@keyframes shd{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.82)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}20%{transform:rotate(-14deg)}40%{transform:rotate(12deg)}60%{transform:rotate(-8deg)}80%{transform:rotate(4deg)}}
@media (prefers-reduced-motion:reduce){.e1,.e2,.e3,.tw,.shd{animation:none}.eggs g.sp,.eggs g.bs{display:none}.wob .wg{animation:none}.hatching .hzg,.hatching .ck,.hatching .cap,.hatching .pip{animation:none}}

<body>
<header><div class="logo"><svg viewBox="-34 -40 68 80" aria-hidden="true"><path fill="#fff" d="M0-38C20-38 31-9 31 9C31 26 17 38 0 38C-17 38-31 26-31 9C-31-9-20-38 0-38Z"/><ellipse cx="-10" cy="-14" rx="4" ry="9" fill="#087DE0" opacity=".25" transform="rotate(18 -10 -14)"/></svg></div><div><h1>Javaid Hussain <span>Dairy Farm</span></h1><div class="sub">Egg trading records &middot; Desi &amp; Farmy</div></div></header>

<script>
var S={products:[],buys:[],sells:[]};
try{var raw=localStorage.getItem("jt_data");if(raw)S=JSON.parse(raw)}catch(e){}
if(!S.set)S.set={days:5};
function save(){try{localStorage.setItem("jt_data",JSON.stringify(S))}catch(e){}}
var U={piece:1,dozen:12,tray:30},UL={piece:"piece",dozen:"dozen",tray:"tray (30)"};
var view="home",range="7",from="",to="",cust=null,pend=null,draft={};
var IC=function(p){return '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+p+'</svg>'};
var TABS=[["home",IC('<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/>'),"Home"],["dash",IC('<path d="M5 20V11M12 20V4M19 20v-6"/><path d="M2 20h20"/>'),"Revenue"],["buy",IC('<path d="M12 3v12M7 10l5 5 5-5"/><path d="M4 20h16"/>'),"Buy"],["sell",IC('<path d="M12 17V5M7 10l5-5 5 5"/><path d="M4 20h16"/>'),"Sell"],["cust",IC('<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 3-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="17.5" cy="9" r="2.5"/><path d="M17 14c2.8 0 4.5 1.8 4.5 4.5"/>'),"Customers"],["prod",IC('<path d="M3 7.5L12 3l9 4.5v9L12 21l-9-4.5z"/><path d="M3 7.5l9 4.5 9-4.5M12 12v9"/>'),"Stock"]];
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function today(d){d=d||new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function money(n){return "Rs "+Math.round(n).toLocaleString("en-US")}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function amt(t){return t.qty*t.rate}
function pname(id){var p=S.products.find(function(x){return x.id==id});return p?p.name+" \u00B7 "+p.type+" \u00B7 "+p.size:"Deleted product"}
function eggs(t){return t.qty*U[t.unit]}
function key(n){return n.trim().toLowerCase()}
function fdate(d){var p=d.split("-");return p[2]+"/"+p[1]+"/"+p[0]}
function go(v){view=v;cust=null;pend=null;render()}
function render(){
  var NA=alerts().length;document.getElementById("nav").innerHTML=TABS.map(function(t){return '<button class="'+(view==t[0]?"on":"")+'" onclick="go(\''+t[0]+'\')"><i>'+t[1]+'</i>'+t[2]+(t[0]=='home'&&NA?'<b class="dot">'+NA+'</b>':'')+'</button>'}).join("");
  var h=view=="home"?vHome():view=="dash"?vDash():view=="buy"?vTrade("buy"):view=="sell"?vTrade("sell"):view=="cust"?(cust?vCustDetail():vCust()):vProd();
  document.getElementById("app").innerHTML=(view=="buy"||view=="sell")?'<div class="cols">'+h+'</div>':h;
}
/* ---------- Smart stock assistant ---------- */
var BC={r:'var(--rd)',o:'var(--wn)',g:'var(--gr)',m:'var(--mu)'};
function unitOpts(sel){return Object.keys(UL).map(function(u){return '<option value="'+u+'"'+(u==sel?' selected':'')+'>'+UL[u]+'</option>'}).join('')}
function stockOf(id){var p=S.products.find(function(x){return x.id==id}),s=p&&p.open?p.open:0;S.buys.forEach(function(t){if(t.pid==id)s+=eggs(t)});S.sells.forEach(function(t){if(t.pid==id)s-=eggs(t)});return s}
function fq(e){var n=Math.abs(e),g=e<0?'-':'';return n>=30?g+(n/30).toFixed(1).replace('.0','')+' trays ('+g+n.toLocaleString('en-US')+' eggs)':g+n+' eggs'}
function perDay(a){return a>=30?(a/30).toFixed(1).replace('.0','')+' trays':Math.round(a)+' eggs'}
function dayDiff(a,b){return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/864e5)}
function forecast(id){
  var ts=S.sells.filter(function(t){return t.pid==id});if(!ts.length)return null;
  var start=today(new Date(Date.now()-13*864e5)),first=ts.reduce(function(m,t){return t.date<m?t.date:m},'9999-99-99');
  var sum=ts.filter(function(t){return t.date>=start}).reduce(function(a,t){return a+eggs(t)},0);if(!sum)return null;
  var avg=sum/Math.min(14,Math.max(1,dayDiff(first,today())+1)),st=stockOf(id);
  return{avg:avg,days:st/avg,need:Math.ceil((avg*10-st)/30)};
}
function status(id){
  var st=stockOf(id),f=forecast(id),A=S.set.days,o={f:f,st:st};
  if(st<0){o.lvl=3;o.c='r';o.t='Negative stock';return o}
  if(st==0&&(f||S.sells.some(function(t){return t.pid==id}))){o.lvl=3;o.c='r';o.t='Out of stock';return o}
  if(!f){o.lvl=0;o.c='m';o.t=st>0?'No recent sales':'No stock yet';return o}
  if(f.days<2){o.lvl=3;o.c='r';o.t='Under 2 days left';return o}
  if(f.days<=A){o.lvl=2;o.c='o';o.t='About '+Math.floor(f.days)+' days left';return o}
  o.lvl=0;o.c='g';o.t='~'+Math.floor(f.days)+' days of stock';return o;
}
function barPct(s){return s.st<=0?2:s.f?Math.max(4,Math.min(100,s.f.days/(S.set.days*3)*100)):50}
function alerts(){var A=[];S.products.forEach(function(p){var s=status(p.id);if(s.lvl>=1)A.push({p:p,s:s})});return A.sort(function(a,b){return b.s.lvl-a.s.lvl})}
function amsg(a){
  var s=a.s,f=s.f,n='<strong>'+esc(pname(a.p.id))+'</strong>';
  if(s.st<0)return n+': sales are '+fq(-s.st)+' more than recorded purchases. Add opening stock or check your entries.';
  var h=s.st==0?n+' is <strong>out of stock</strong>.':n+' will run out in about <strong>'+Math.max(1,Math.round(f.days))+' day(s)</strong> (around '+fdate(today(new Date(Date.now()+f.days*864e5)))+'). Only '+fq(s.st)+' left.';
  if(f)h+=' You sell about '+perDay(f.avg)+' per day.'+(f.need>0?' Suggested order: <strong>'+f.need+' trays</strong> to cover the next 10 days.':'');
  return h;
}

  var nm=(S1[0]||B1[0]||{who:cust}).who,ts=S1.reduce(function(a,t){return a+amt(t)},0),tb=B1.reduce(function(a,t){return a+amt(t)},0);
  var h='<a class="back" onclick="go(\'cust\')">\u2039 All customers</a><div class="card"><h2>'+esc(nm)+'</h2><div class="grid">'+
  '<div class="stat"><div class="m">Sold to them</div><div class="v g">'+money(ts)+'</div></div><div class="stat"><div class="m">Bought from them</div><div class="v r">'+money(tb)+'</div></div></div></div>';
  var all=S1.map(function(t){return{t:t,k:"sell"}}).concat(B1.map(function(t){return{t:t,k:"buy"}})).sort(function(a,b){return b.t.date<a.t.date?-1:b.t.date>a.t.date?1:0});
  h+='<div class="card"><h2>Order history</h2>';
  all.forEach(function(x){h+=row(x.t,x.k,false).replace('<b>','<b><span class="tag" style="margin:0 6px 0 0">'+(x.k=="sell"?"SOLD":"BOUGHT")+'</span>')});
  return h+'</div>';
}
/* ---------- Revenue ---------- */
function inRange(d){
  var f,t=today();
  if(range=="custom"){f=from||"0000-00-00";t=to||"9999-99-99"}
  else{var n=range=="1"?0:+range-1;f=today(new Date(Date.now()-n*864e5))}
  return d>=f&&d<=t;
}
function vDash(){
  var R=[["1","Today"],["7","7 days"],["30","30 days"],["365","1 year"],["custom","Custom"]];
  var h='<div class="chips">'+R.map(function(r){return '<button class="chip'+(range==r[0]?" on":"")+'" onclick="range=\''+r[0]+'\';render()">'+r[1]+'</button>'}).join("")+'</div>';
  if(range=="custom")h+='<div class="row"><div><label>From</label><input type="date" value="'+from+'" onchange="from=this.value;render()"></div><div><label>To</label><input type="date" value="'+to+'" onchange="to=this.value;render()"></div></div>';
  var s=S.sells.filter(function(t){return inRange(t.date)}),b=S.buys.filter(function(t){return inRange(t.date)});
  var rev=s.reduce(function(a,t){return a+amt(t)},0),cost=b.reduce(function(a,t){return a+amt(t)},0),
  es=s.reduce(function(a,t){return a+eggs(t)},0),eb=b.reduce(function(a,t){return a+eggs(t)},0),pr=rev-cost;
  h+='<div class="card"><div class="grid"><div class="stat"><div class="m">Revenue (sales)</div><div class="v g">'+money(rev)+'</div></div>'+
  '<div class="stat"><div class="m">Purchases</div><div class="v r">'+money(cost)+'</div></div>'+
  '<div class="stat"><div class="m">Net (sales \u2212 purchases)</div><div class="v '+(pr>=0?"g":"r")+'">'+money(pr)+'</div></div>'+
  '<div class="stat"><div class="m">Eggs sold / bought</div><div class="v">'+es.toLocaleString("en-US")+' / '+eb.toLocaleString("en-US")+'</div></div></div></div>';
  var by={};s.forEach(function(t){var p=S.products.find(function(x){return x.id==t.pid});var k=p?p.type+" \u00B7 "+p.size:"Deleted";by[k]=(by[k]||0)+amt(t)});
  h+='<div class="card"><h2>Sales by type &amp; size</h2>';
  var ks=Object.keys(by).sort();
  if(!ks.length)h+='<div class="empty">No sales in this period.</div>';
  ks.forEach(function(k){h+='<div class="item"><b>'+esc(k)+'</b><div class="amt">'+money(by[k])+'</div></div>'});
  h+='</div><div class="m" style="text-align:center">'+s.length+(s.length==1?' sale':' sales')+' &middot; '+b.length+(b.length==1?' purchase':' purchases')+' in this period</div>';
  return h;
}

/* ===== Device activation lock ===== */
var PUB={"kty":"EC","x":"U425Gr59wlw0nhm5Lo3KQNk7I4Ab9PIAkVkmOXIf02w","y":"KvZSKsXOaG66ZjT9xt_mYjd8iAP_Cu3gb9RKU68Qde8","crv":"P-256"},DK="jhdf_dev",AK="jhdf_key";
function devId(){var d=localStorage.getItem(DK);if(!d||!/^[0-9A-F]{4}(-[0-9A-F]{4}){3}$/.test(d)){var a=new Uint8Array(8);crypto.getRandomValues(a);d=Array.prototype.map.call(a,function(b){return("0"+b.toString(16)).slice(-2)}).join("").toUpperCase().replace(/(.{4})(?=.)/g,"$1-");localStorage.setItem(DK,d)}return d}
function b64u(s){s=s.replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
function verifyKey(key,dev){return Promise.resolve().then(function(){return crypto.subtle.importKey("jwk",PUB,{name:"ECDSA",namedCurve:"P-256"},false,["verify"])}).then(function(k){return crypto.subtle.verify({name:"ECDSA",hash:"SHA-256"},k,b64u(key),new TextEncoder().encode("JHDF1|"+dev))}).catch(function(){return false})}
function lockUI(go,dev,note){
  var o=document.createElement("div");o.id="lock";
  o.innerHTML='<div class="lk"><div class="lg">\uD83E\uDD5A</div><h2>Activate your app</h2><p>This copy is not activated on this device yet.</p>'+
  (dev?'<div class="st">1. Your Device ID</div><div class="did"><code id="lkd"></code><button class="lkb sec" id="lkc">Copy</button></div><p style="font-size:12px">Send this ID to the developer to get your activation key.</p>'+
  '<div class="st">2. Activation key</div><textarea id="lkk" placeholder="Paste your activation key here" spellcheck="false" autocomplete="off"></textarea><button class="lkb full" id="lka">Activate</button>':'')+
  '<div class="er" id="lke"></div></div>';
  document.body.appendChild(o);
  var e=o.querySelector("#lke");e.textContent=note||"";
  if(!dev)return;
  o.querySelector("#lkd").textContent=dev;
  o.querySelector("#lkc").onclick=function(){var b=this;(navigator.clipboard?navigator.clipboard.writeText(dev):Promise.reject()).then(function(){b.textContent="Copied!"},function(){var r=document.createRange();r.selectNodeContents(o.querySelector("#lkd"));var sel=getSelection();sel.removeAllRanges();sel.addRange(r);b.textContent="Select & copy"});setTimeout(function(){b.textContent="Copy"},1800)};
  o.querySelector("#lka").onclick=function(){var k=o.querySelector("#lkk").value.replace(/\s+/g,"");if(!k){e.textContent="Please paste your activation key.";return}
    verifyKey(k,dev).then(function(ok){if(!ok){e.textContent="Invalid key for this device. Check it and try again.";return}try{localStorage.setItem(AK,k)}catch(x){}o.remove();go()})}
}
function gate(go){
  if(!(window.crypto&&crypto.subtle&&window.TextEncoder)){lockUI(go,"","This browser cannot verify activation. Please open the link in an up-to-date Chrome or Safari.");return}
  var d;try{d=devId()}catch(e){lockUI(go,"","Browser storage is blocked. Please allow site data and reload.");return}
  var k=localStorage.getItem(AK);
  if(!k){lockUI(go,d);return}
  verifyKey(k,d).then(function(ok){if(ok)go();else{try{localStorage.removeItem(AK)}catch(x){}lockUI(go,d,"Activation is not valid on this device.")}})
}
gate(function(){render()});
</script>
